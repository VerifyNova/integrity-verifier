name: CI

# Builds and tests the verifier on every Node.js version it supports, on every
# push to main and every pull request.
#
# The source of this repository, this file included, is kept in UnifyID's API
# repository (packages/integrity-verifier) and copied here by its
# scripts/trust-layer/sync-integrity-verifier.mjs. A weekly job there fails when
# this copy differs.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Includes the command line, built above, against a local JSON-RPC
      # endpoint that answers as Base mainnet (chain 8453).
      - name: Test
        run: npm test

      # What `npm publish` would ship: dist, README, LICENSE and package.json.
      - name: Package contents
        run: npm pack --dry-run
